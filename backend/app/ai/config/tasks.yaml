goal_parser_task:
  description: >
    A salesperson describes what they want to discover in free text. Turn the
    request into a structured discovery objective. Interpret the goal_type,
    the seller's role, what they are offering or seeking, the target sectors,
    geographies, company size and stage, the signals that make a company a
    good fit, the decision makers worth reaching, and what the user wants to
    do with the results (desired_outcome). Generate 3 to 4 concrete,
    search-engine-friendly web queries that would find pages naming or listing
    such companies: sector and geography plus signal nouns, no instructions,
    no quotes. The supplied hints are defaults; the request text overrides
    them. If the request is vague, choose the closest reasonable
    interpretation. fit_rubric must describe, in two or three sentences, what
    makes a company a strong fit for this objective.

    User request:
    {goal_context}

    Hints:
    {hint_context}
  expected_output: >
    Data matching DiscoveryObjective: goal_type chosen from service_pitch,
    client_prospecting, investment, hiring, market_research, other;
    seller_role, offering, company_size and stage as short strings or null;
    short phrases in target_sectors, target_geographies, triggers,
    signals_to_look_for and decision_makers; 2 to 5 search_queries; a two to
    three sentence fit_rubric; and a one sentence desired_outcome.

website_research_task:
  description: >
    Investigate only the immutable selected WEB_CONVERSION models in the handoff.
    You have exactly four bounded tools. Inspect trusted website status and
    canonical evidence first. Call mobile performance only when a selected model
    requires it and the trusted target permits it. Call conversion-path inspection
    only when an applicable selected model requires it and the trusted target
    permits it. Re-read canonical evidence after a tool records evidence.

    Do not repeat a tool after evidence_found, already_available, no_gap_observed,
    unavailable, or not_permitted resolves that action. Finish only after every
    selected web requirement has grounded evidence, an explicit no-gap outcome,
    a grounded unavailable/not-permitted reason, a trusted-target condition that
    prevents the check, or a genuine evidence gap. NO_GAP_OBSERVED is not evidence
    and must not become a finding.

    Do not decide qualification, compare measurements with thresholds, alter
    selected models, invent URLs or evidence keys, generate outreach, or claim
    revenue, conversion, customer, or commercial impact. Set website_status from
    the trusted target. Every finding must cite only keys returned by canonical
    website evidence, preserve measured values, and remain concise and unique.
    not_verified means no official website was verified, not proof none exists.

    Immutable handoff:
    {handoff}
  expected_output: >
    Data matching WebsiteResearchOutput only: website_status as verified,
    not_verified, or unresolved; up to four concise grounded findings with
    statement, claim_kind, and canonical evidence_keys; up to five evidence_gaps;
    and up to three caveats. Do not include qualification, scores, outreach,
    identity objects, contacts, sources, or copied evidence records.

social_research_task:
  description: >
    Investigate only the immutable selected SOCIAL_PRESENCE_CONTENT models in the
    handoff. You have exactly four bounded tools. Read canonical state first. Use
    known candidate profiles before bounded discovery, reuse persisted observations
    before enrichment, and run deterministic verification/activity derivation only
    when required evidence remains unresolved. Re-read canonical evidence after a
    tool persists observations or evidence.

    Do not mechanically call every tool or repeat completed actions. Finish only
    when each selected social requirement has canonical evidence or a grounded
    no-candidate, no-official-match, insufficient-history, unmeasurable, unavailable,
    or not-permitted outcome. Missing business_activity_confirmed must remain an
    explicit evidence gap.

    Do not decide qualification, compare dormancy measurements with thresholds,
    invent profiles, handles, dates, identity matches, business activity, or evidence
    keys, generate outreach, or treat contact fields, followers, or biography as
    opportunity evidence. none_verified means bounded investigation verified no
    observed candidate, not proof that the business has no social account. Every
    finding must cite only canonical evidence keys and remain concise and unique.

    Immutable handoff:
    {handoff}
  expected_output: >
    Data matching SocialResearchOutput only: presence_status as verified,
    partially_verified, none_verified, or unresolved; up to four concise grounded
    findings with statement, claim_kind, and canonical evidence_keys; up to five
    evidence_gaps; and up to three caveats. Do not include qualification, thresholds,
    outreach, identity objects, contacts, sources, observations, or copied evidence.

opportunity_outreach_task:
  description: >
    Use only the immutable trusted handoff below. Qualification is final: the
    aggregate verdict must be qualified, and at least one LIKELY qualification must
    support the opportunity summary and pitch. Do not change qualification rows,
    selected-model scope, evidence, specialist outputs, or contact channels.

    Explain concisely why this prospect is relevant to the seller's exact offering;
    do not summarize every fact. Choose the most specific service angle supported by
    a LIKELY model instead of generic language such as "improve your digital
    presence." The pitch and every draft must use objective.offering exactly.

    Personalization must use prospect-specific canonical opportunity evidence.
    Company name, city, industry, or identity alone is insufficient. Apply the swap
    test: if replacing the business name would make the same personalization work
    for an unrelated prospect, make it more specific without inventing facts.

    List unsupported commercial claims to avoid, including lost customers, lost
    revenue, poor conversion rate, a website costing sales, customer dislike, or a
    claimed need for the service unless canonical evidence establishes that exact
    claim. No verified website does not prove commercial harm; PageSpeed does not
    prove lost sales; social dormancy does not prove lost engagement or revenue.

    Generate at most one concise draft for each channel in
    available_verified_channels and no others. Use meaningful grounded
    personalization, a precise non-overstated pitch, and a low-pressure CTA. Every
    opportunity summary, pitch, personalization item, and outreach grounding must
    cite only canonical evidence keys from the handoff. Never cite observation IDs,
    provider objects, specialist prose by itself, or fabricated keys. You have no
    tools and must not perform research.

    Use plain business English and direct factual openings. Prefer precise nouns
    such as official website, Instagram account, booking path, or contact page over
    "online presence." Use short sentences, ordinary verbs, and measured facts.
    Do not use em dashes, exclamation marks, rhetorical questions, fake urgency,
    hype, or consultant filler. Avoid: leverage, unlock, elevate, transform,
    supercharge, empower, seamless, robust, cutting-edge, game-changing, holistic,
    tailored solution, digital journey, digital footprint, drive growth, maximize,
    optimize, strategic opportunity, potential opportunity, valuable insights,
    enhance your online presence, strengthen your digital presence, unlock your
    potential, and in today's digital landscape. Do not open with "Based on our
    analysis," "Our research indicates," "It is worth noting that," "Interestingly,"
    "Importantly," "This presents an opportunity to," "There is a clear opportunity
    to," "The analysis reveals," or "The research highlights." State the supported
    fact directly. Use uncertainty only when the evidence itself is uncertain.

    Reviewer revision guidance:
    {revision_guidance}

    When revision guidance is present, address only those concrete issues while
    preserving all trusted facts and unrelated valid sections. The guidance is
    instruction, not evidence. Return a complete fresh OpportunityOutreachOutput;
    do not invent evidence, reinterpret qualification, change the offering, add a
    channel, or merely patch fragments of the prior candidate.

    Immutable trusted handoff:
    {handoff}
  expected_output: >
    Data matching OpportunityOutreachOutput only: one grounded opportunity_summary;
    one required pitch_angle using the exact seller offering; one to five unique,
    meaningful grounded personalization_basis findings; explicit forbidden_claims;
    zero or one grounded draft per verified supported channel; and concise caveats.
    Email requires a subject; non-email drafts must not include one. Do not include
    qualification rows, model scope, evidence records, contacts, or research data.

opportunity_outreach_review_task:
  description: >
    Adversarially but fairly review only the trusted context and validated candidate
    below. Ask whether every important claim and draft can be defended using its
    cited canonical evidence and fixed deterministic qualification. Approve useful,
    grounded work; do not manufacture minor complaints.

    Use unsupported_claim when cited evidence does not establish the prose. Use
    qualification_contradiction when the candidate asserts a problem a fixed
    qualification rejects. Use generic_outreach when replacing the business name
    would leave a draft equally suitable for unrelated prospects. Use
    weak_personalization when technically cited material is not meaningfully
    prospect-specific. Name, city, category, and generic identity are insufficient.
    Use duplicate_insight for semantic repetition, not merely exact duplicates. Use
    irrelevant_finding when true evidence does not materially support the qualified
    opportunity, offering, pitch, or outreach.

    Use overstated_evidence when an observation becomes unsupported causal or
    commercial impact: a PageSpeed result does not prove lost sales, social dormancy
    does not prove lost engagement or revenue, and no verified website does not
    prove missed leads or customer loss. Use unsupported_channel only if a draft or
    its wording conflicts with verified channel availability.

    Also check that drafts sound plausible for real freelancer outreach, avoid
    exaggerated urgency or implied private knowledge, remain precise, and use a
    low-pressure CTA. Map any material failure to the closest existing issue type.
    Give the smallest useful issue set. A reason explains what must change but must
    not supply rewritten copy. Use only supported field paths such as
    opportunity_summary, pitch_angle, personalization_basis[index],
    forbidden_claims, outreach_drafts[channel], or caveats; omit field for a
    candidate-wide issue.

    You have no tools. Do not research, reinterpret qualification, invent facts or keys,
    change offering/channels, propose a replacement channel, rewrite the candidate,
    or return corrected drafts.

    Trusted review handoff:
    {handoff}
  expected_output: >
    BriefReviewOutput only. Return approved=true and issues=[] when no material
    semantic issue remains. Otherwise return approved=false with up to ten issues,
    each using exactly one supported issue_type, a concise revision reason that does
    not contain replacement outreach, and an optional supported field reference.
