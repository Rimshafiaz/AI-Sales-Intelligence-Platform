research_task:
  description: >
    Analyze the supplied evidence for {company_name}. Use only that evidence to
    identify the company overview, industry, headquarters, company size, products
    and services, and publicly supported business signals. Cite the supporting
    source URL for each factual finding. Do not invent facts. Mark unavailable or
    uncertain information clearly.

    Evidence:
    {evidence_context}
  expected_output: >
    Structured, citation-aware company research findings. Each factual finding
    must include a supporting source URL, while unavailable or inferred information
    must be explicitly labeled. Return data matching ResearchAgentOutput: one
    company_profile object with company_summary, optional single findings set to
    null when unavailable, and products_and_services and funding_information as
    lists (use [] when unavailable). Every finding must contain statement,
    citations, is_inference, and rationale. Each citation must contain source_url
    and may contain supporting_excerpt.

technology_task:
  description: >
    Analyze the supplied evidence for {company_name} to identify only technologies
    and technical signals that are publicly supported by the evidence. Do not
    invent, guess, or infer an unstated technology. Cite a supporting source URL
    for every factual technology claim. You may include a technical implication
    only when it is explicitly labeled is_inference=true and includes a rationale.
    Return an empty technologies list when the evidence supports no technologies.

    Evidence:
    {evidence_context}
  expected_output: >
    Data matching TechnologyAgentOutput: a technologies list. Each item has a
    technology finding with statement, citations, is_inference=false, and rationale.
    An optional implication must have statement, citations, is_inference=true, and
    rationale. Each citation must contain source_url and may contain
    supporting_excerpt.

news_task:
  description: >
    Analyze the supplied evidence for {company_name}. Today's date is {current_date}.
    Extract only publicly supported business signals with one of these types: news,
    hiring, expansion, funding, or announcement. Cite a supporting source URL for
    every signal. Use occurred_at only when the evidence provides a full event date;
    otherwise use null and state in the finding rationale that the event date is
    unconfirmed. Do not invent events or dates. Do not describe an event as recent
    when evidence shows it occurred more than 12 months before today's date. Return
    an empty business_signals list when no supported signal exists.

    Evidence:
    {evidence_context}
  expected_output: >
    Data matching NewsAgentOutput: a business_signals list. Each item has signal_type,
    a factual finding with statement, citations, is_inference=false, and rationale,
    plus occurred_at as an ISO date or null. Each citation must contain source_url
    and may contain supporting_excerpt.

pain_point_task:
  description: >
    Analyze the supplied specialist outputs for {company_name}. Identify only
    plausible business pain points supported by those outputs. Every pain point is
    a hypothesis, not a confirmed internal fact: use is_inference=true, cautious
    language such as may or likely, a rationale explaining why it is plausible, and
    citations already present in the specialist outputs. Never invent evidence or
    source URLs. Set confidence to low, medium, or high based on the strength and
    amount of supplied support. Do not create a pain point from a generic company
    description alone; require a concrete change or pressure signal such as stated
    expansion, funding, hiring, or technical scale/complexity. Return an empty
    pain_points list when there is no useful, evidence-backed hypothesis. When
    a discovery objective is provided, prioritize pain points relevant to it;
    when none is provided, stay general.

    Discovery objective:
    {objective_context}

    Company research output:
    {research_output}

    Technology output:
    {technology_output}

    News output:
    {news_output}
  expected_output: >
    Data matching PainPointAgentOutput: a pain_points list. Each item has a
    hypothesis containing statement, citations, is_inference=true, and rationale,
    plus a confidence value of low, medium, or high. Each citation must contain a
    source_url from the supplied specialist outputs and may contain
    supporting_excerpt.

strategy_task:
  description: >
    Use the supplied specialist outputs and opportunity scoring rubric to prepare
    an explainable sales recommendation for {company_name}. Follow the rubric when
    assigning an opportunity score from 0 to 100 and choosing prioritize, consider,
    or do_not_prioritize. Every score reason must be an evidence-backed inference
    with citations and explain why the signal matters. The contact recommendation,
    sales strategy, sales angle, value proposition, suggested decision-maker roles,
    and outreach personalization rationale must be cited inferences, not established
    facts. Do not invent company facts, pain points, buying intent, budgets, or named
    decision makers. Use caveats when evidence is weak. Produce outreach drafts for
    human review; do not imply that outreach will be sent automatically.
    Keep the structured response concise: use one executive summary, one to three
    score reasons, one to three suggested decision-maker roles, at most three
    caveats, and concise one-sentence findings and rationales. Limit the cold email
    to 120 words and the LinkedIn message to 60 words.

    The salesperson supplied the following optional regeneration guidance. Honor
    it only where the evidence supports it, keep every claim grounded and cited,
    and never treat the guidance itself as a fact about the company.

    Salesperson guidance:
    {guidance}

    The discovery objective, when provided, is the source of truth for scoring
    and positioning: score the opportunity relative to it, shape the contact
    recommendation and sales angle around it, and write the outreach drafts in
    the seller's role and voice.

    Discovery objective:
    {objective_context}

    Opportunity scoring rubric:
    {opportunity_rubric}

    Company research output:
    {research_output}

    Technology output:
    {technology_output}

    News output:
    {news_output}

    Pain-point output:
    {pain_point_output}
  expected_output: >
    Data matching StrategyAgentOutput: executive_summary, opportunity_assessment
    with score and cited reasons, contact_recommendation with an inference-backed
    rationale, confidence, strategy, suggested_decision_makers, personalized_outreach,
    and caveats. The executive summary must be factual and cited. Recommendation
    rationales and decision-maker rationales must use is_inference=true. Every
    citation must contain source_url and may contain supporting_excerpt.

reviewer_task:
  description: >
    Review the supplied candidate outputs for {company_name} using only the
    original evidence context, opportunity scoring rubric, and reviewer checklist.
    Do not research new facts, rewrite the report, or invent issues. Approve only
    when there are no material grounding, citation, certainty, scoring-policy, or
    outreach problems. When rejecting, return approved=false and clear issue text
    identifying the unsupported claim, missing/invalid citation, or certainty
    problem. Citation URLs may use harmless normalization such as a trailing slash.

    Original evidence context:
    {evidence_context}

    Opportunity scoring rubric:
    {opportunity_rubric}

    Reviewer checklist:
    {reviewer_checklist}

    Company research output:
    {research_output}

    Technology output:
    {technology_output}

    News output:
    {news_output}

    Pain-point output:
    {pain_point_output}

    Strategy output:
    {strategy_output}
  expected_output: >
    Data matching ReviewerOutput. Return approved=true with issues=[] only when
    there are no material issues. Otherwise return approved=false with one or more
    concise, clear revision instructions.

goal_parser_task:
  description: >
    A salesperson describes what they want to discover in free text. Turn the
    request into a structured discovery objective. Interpret the goal_type,
    the seller's role, what they are offering or seeking, the target sectors,
    geographies, company size and stage, the signals that make a company a
    good fit, the decision makers worth reaching, and what the user wants to
    do with the results (desired_outcome). Generate 3 to 4 concrete,
    search-engine-friendly web queries that would find pages naming or listing
    such companies: sector and geography plus signal nouns, no instructions,
    no quotes. The supplied hints are defaults; the request text overrides
    them. If the request is vague, choose the closest reasonable
    interpretation. fit_rubric must describe, in two or three sentences, what
    makes a company a strong fit for this objective.

    User request:
    {goal_context}

    Hints:
    {hint_context}
  expected_output: >
    Data matching DiscoveryObjective: goal_type chosen from service_pitch,
    client_prospecting, investment, hiring, market_research, other;
    seller_role, offering, company_size and stage as short strings or null;
    short phrases in target_sectors, target_geographies, triggers,
    signals_to_look_for and decision_makers; 2 to 5 search_queries; a two to
    three sentence fit_rubric; and a one sentence desired_outcome.
