research_task:
  description: >
    Analyze the supplied evidence for {company_name}. Use only that evidence to
    identify the company overview, industry, headquarters, company size, products
    and services, and publicly supported business signals. Cite the supporting
    source URL for each factual finding. Do not invent facts. Mark unavailable or
    uncertain information clearly.

    Evidence:
    {evidence_context}
  expected_output: >
    Structured, citation-aware company research findings. Each factual finding
    must include a supporting source URL, while unavailable or inferred information
    must be explicitly labeled. Return data matching ResearchAgentOutput: one
    company_profile object with company_summary, optional single findings set to
    null when unavailable, and products_and_services and funding_information as
    lists (use [] when unavailable). Every finding must contain statement,
    citations, is_inference, and rationale. Each citation must contain source_url
    and may contain supporting_excerpt.

technology_task:
  description: >
    Analyze the supplied evidence for {company_name} to identify only technologies
    and technical signals that are publicly supported by the evidence. Do not
    invent, guess, or infer an unstated technology. Cite a supporting source URL
    for every factual technology claim. You may include a technical implication
    only when it is explicitly labeled is_inference=true and includes a rationale.
    Return an empty technologies list when the evidence supports no technologies.

    Evidence:
    {evidence_context}
  expected_output: >
    Data matching TechnologyAgentOutput: a technologies list. Each item has a
    technology finding with statement, citations, is_inference=false, and rationale.
    An optional implication must have statement, citations, is_inference=true, and
    rationale. Each citation must contain source_url and may contain
    supporting_excerpt.

news_task:
  description: >
    Analyze the supplied evidence for {company_name}. Today's date is {current_date}.
    Extract only publicly supported business signals with one of these types: news,
    hiring, expansion, funding, or announcement. Cite a supporting source URL for
    every signal. Use occurred_at only when the evidence provides a full event date;
    otherwise use null and state in the finding rationale that the event date is
    unconfirmed. Do not invent events or dates. Do not describe an event as recent
    when evidence shows it occurred more than 12 months before today's date. Return
    an empty business_signals list when no supported signal exists.

    Evidence:
    {evidence_context}
  expected_output: >
    Data matching NewsAgentOutput: a business_signals list. Each item has signal_type,
    a factual finding with statement, citations, is_inference=false, and rationale,
    plus occurred_at as an ISO date or null. Each citation must contain source_url
    and may contain supporting_excerpt.
